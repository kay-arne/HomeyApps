    <rect x="144" y="160" width="672" height="440" rx="48" />
    <rect x="232" y="240" width="496" height="280" rx="24" />
    <line x1="480" y1="600" x2="480" y2="712" />
    <line x1="352" y1="760" x2="608" y2="760" />
  </g>
</svg>
