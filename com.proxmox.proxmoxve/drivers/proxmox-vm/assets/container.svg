  <g fill="none" stroke="#000000" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="480,160 200,312 480,464 760,312" />
    <polygon points="200,312 480,464 480,784 200,632" />
    <polygon points="760,312 480,464 480,784 760,632" />
  </g>
