<html>
  <head>
    <style>
      body {
        margin: 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .vm-info {
        display: flex;
        align-items: center;
        gap: var(--homey-su-2);
        min-width: 0;
      }
      .vm-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-running {
        background: var(--homey-text-color-green);
      }
      .status-stopped {
        background: var(--homey-line-color);
      }
      .vm-toggle {
        border: 1px solid var(--homey-line-color);
        border-radius: var(--homey-su-2);
        background: transparent;
        color: var(--homey-text-color);
        font-size: var(--homey-font-size-small);
        padding: 4px var(--homey-su-2);
        cursor: pointer;
        flex-shrink: 0;
      }
      .vm-toggle:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .empty {
        padding: var(--homey-su-2) 0;
      }
    </style>
  </head>

  <body class="homey-widget">
    <div id="content">
      <p class="homey-text-small-light homey-text-align-center">Loading…</p>
    </div>

    <script type="text/javascript">
      let deviceId = null;
      let busy = false;

      function render(item) {
        const content = document.getElementById('content');

        if (!item.available) {
          content.innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">Device unavailable</p>';
          return;
        }

        const statusClass = item.running ? 'status-running' : 'status-stopped';
        const label = busy ? '…' : (item.running ? 'Shutdown' : 'Start');
        const detail = item.running && item.cpuPerc != null
          ? `${item.cpuPerc}% CPU · ${item.memPerc}% Mem`
          : (item.running ? 'Running' : 'Stopped');

        content.innerHTML = `
          <div class="row">
            <div class="vm-info">
              <span class="status-dot ${statusClass}"></span>
              <div>
                <div class="vm-name homey-text-small">${item.name}</div>
                <div class="homey-text-small-light">${detail}</div>
              </div>
            </div>
            <button class="vm-toggle" id="toggleBtn" ${busy ? 'disabled' : ''}>${label}</button>
          </div>`;

        document.getElementById('toggleBtn').addEventListener('click', () => onToggleClick(item.running));
      }

      function onToggleClick(currentlyRunning) {
        busy = true;
        const btn = document.getElementById('toggleBtn');
        if (btn) {
          btn.disabled = true;
          btn.textContent = '…';
        }

        Homey.api('POST', '/state?deviceId=' + encodeURIComponent(deviceId), { action: currentlyRunning ? 'shutdown' : 'start' })
          .then(() => {
            // Give Proxmox a moment before polling the new state
            setTimeout(refresh, 1500);
          })
          .catch(console.error)
          .finally(() => {
            busy = false;
          });
      }

      function refresh() {
        if (!deviceId) {
          document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">No VM/Container selected. Configure this widget to pick one.</p>';
          return;
        }
        Homey.api('GET', '/status?deviceId=' + encodeURIComponent(deviceId), {})
          .then(render)
          .catch((err) => {
            document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">' + (err && err.message ? err.message : 'Error loading data') + '</p>';
          });
      }

      function onHomeyReady(Homey) {
        Homey.ready();
        deviceId = Homey.getSettings().device?.id;
        refresh();
        setInterval(refresh, 15000);
      }
    </script>
  </body>
</html>
