<html>
  <head>
    <style>
      body {
        margin: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-row {
        margin-bottom: var(--homey-su-3);
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--homey-su-2);
        margin-bottom: var(--homey-su-3);
      }
      .stat {
        text-align: center;
      }
      .stat-value {
        font-size: var(--homey-font-size-large);
        font-weight: var(--homey-font-weight-bold);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px var(--homey-su-2);
        border-radius: var(--homey-su-2);
        font-size: var(--homey-font-size-small);
        border: 1px solid var(--homey-line-color);
        white-space: nowrap;
      }
      .badge-warn {
        color: var(--homey-text-color-orange);
        border-color: var(--homey-text-color-orange);
      }
      .badge-ok {
        color: var(--homey-text-color-green);
        border-color: var(--homey-text-color-green);
      }
      .storage-row {
        margin-bottom: var(--homey-su-2);
      }
      .storage-bar-bg {
        height: 6px;
        border-radius: 3px;
        background: var(--homey-line-color-light);
        overflow: hidden;
        margin-top: 2px;
      }
      .storage-bar-fill {
        height: 100%;
        background: var(--homey-text-color-blue);
      }
      .empty {
        padding: var(--homey-su-4) 0;
      }
    </style>
  </head>

  <body class="homey-widget">
    <div id="content">
      <p class="homey-text-small-light homey-text-align-center">Loading…</p>
    </div>

    <script type="text/javascript">
      let deviceId = null;

      function formatBytes(bytes) {
        if (!bytes) return '0 GB';
        return (bytes / 1024 ** 3).toFixed(1) + ' GB';
      }

      function render(data) {
        const content = document.getElementById('content');

        if (!data.available) {
          content.innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">Cluster unavailable</p>';
          return;
        }

        const badges = [];
        if (data.isFallback) badges.push('<span class="badge badge-warn">Fallback active</span>');
        if (data.quorumLost) badges.push('<span class="badge badge-warn">Quorum lost</span>');
        if (badges.length === 0) badges.push('<span class="badge badge-ok">All OK</span>');

        const storageHtml = data.storages.length
          ? data.storages.map((s) => `
              <div class="storage-row">
                <div class="row">
                  <span class="homey-text-small">${s.id}</span>
                  <span class="homey-text-small-light">${s.usedPct}% · ${formatBytes(s.usedBytes)} / ${formatBytes(s.totalBytes)}</span>
                </div>
                <div class="storage-bar-bg"><div class="storage-bar-fill" style="width:${Math.min(s.usedPct, 100)}%"></div></div>
              </div>`).join('')
          : '<p class="homey-text-small-light">No storage data</p>';

        content.innerHTML = `
          <div class="row header-row">
            <span class="homey-text-medium">${data.name}</span>
            ${badges.join(' ')}
          </div>
          <div class="stat-grid">
            <div class="stat"><div class="stat-value">${data.nodeCount ?? '-'}</div><div class="homey-text-small-light">Nodes</div></div>
            <div class="stat"><div class="stat-value">${data.vmCount ?? '-'}</div><div class="homey-text-small-light">VMs</div></div>
            <div class="stat"><div class="stat-value">${data.lxcCount ?? '-'}</div><div class="homey-text-small-light">LXCs</div></div>
          </div>
          ${storageHtml}
        `;
      }

      function refresh() {
        if (!deviceId) {
          document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">No cluster device selected. Configure this widget to pick one.</p>';
          return;
        }
        Homey.api('GET', '/status?deviceId=' + encodeURIComponent(deviceId), {})
          .then(render)
          .catch((err) => {
            document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">' + (err && err.message ? err.message : 'Error loading data') + '</p>';
          });
      }

      function onHomeyReady(Homey) {
        Homey.ready();
        const ids = Homey.getDeviceIds();
        deviceId = ids && ids[0];
        refresh();
        setInterval(refresh, 15000);
      }
    </script>
  </body>
</html>
