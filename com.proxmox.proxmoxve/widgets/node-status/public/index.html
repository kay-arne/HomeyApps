<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        margin: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-row {
        margin-bottom: var(--homey-su-2);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px var(--homey-su-2);
        border-radius: var(--homey-border-radius-small);
        font-size: var(--homey-font-size-small);
        border: var(--homey-line);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .badge-warn {
        color: var(--homey-text-color-orange);
        border-color: var(--homey-text-color-orange);
      }
      .badge-ok {
        color: var(--homey-text-color-green);
        border-color: var(--homey-text-color-green);
      }
      #list {
        overflow-y: auto;
        max-height: 230px;
        touch-action: pan-y;
      }
      .node-row {
        padding: var(--homey-su-2) 0;
        border-bottom: var(--homey-line-light);
      }
      .node-row:last-child {
        border-bottom: none;
      }
      .node-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-right: var(--homey-su-2);
      }
      .empty {
        padding: var(--homey-su-4) 0;
      }
    </style>
  </head>

  <body class="homey-widget">
    <div id="content">
      <p class="homey-text-small-light homey-text-align-center">Loading…</p>
    </div>

    <script type="text/javascript">
      let deviceId = null;

      // Homey's dashboard can hijack vertical touch-scroll from a widget's own scrollable list
      // once more than one widget is stacked in a column - manually drive the scroll and claim
      // the gesture via preventDefault() so #list scrolls instead of the dashboard itself.
      // https://community.homey.app/t/scrolling-issue-in-widget/150676
      let touchStartY = 0;
      let touchStartScrollTop = 0;
      let touchScrollEl = null;

      document.addEventListener('touchstart', (e) => {
        touchScrollEl = e.target.closest('#list');
        if (!touchScrollEl) return;
        touchStartY = e.touches[0].clientY;
        touchStartScrollTop = touchScrollEl.scrollTop;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!touchScrollEl) return;
        const maxScroll = touchScrollEl.scrollHeight - touchScrollEl.clientHeight;
        if (maxScroll <= 0) return;
        const deltaY = touchStartY - e.touches[0].clientY;
        touchScrollEl.scrollTop = Math.max(0, Math.min(maxScroll, touchStartScrollTop + deltaY));
        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      function nodeRow(n) {
        const badge = n.online
          ? '<span class="badge badge-ok">Online</span>'
          : '<span class="badge badge-warn">Offline</span>';

        const detail = n.online
          ? `CPU ${n.cpuPerc ?? '-'}% · Mem ${n.memPerc ?? '-'}% · ${n.vmCount} VMs · ${n.lxcCount} LXCs`
          : 'Unreachable';

        return `
          <div class="node-row">
            <div class="row">
              <span class="node-name homey-text-small">${n.name}</span>
              ${badge}
            </div>
            <div class="homey-text-small-light">${detail}</div>
          </div>`;
      }

      function render(data) {
        const content = document.getElementById('content');

        if (!data.available) {
          content.innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">Cluster unavailable</p>';
          return;
        }

        const listHtml = data.nodes.length
          ? data.nodes.map(nodeRow).join('')
          : '<p class="homey-text-small-light empty">No nodes found</p>';

        content.innerHTML = `
          <div class="row header-row">
            <span class="homey-text-medium">${data.name}</span>
          </div>
          <div id="list">${listHtml}</div>
        `;
      }

      function refresh() {
        if (!deviceId) {
          document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">No cluster device selected. Configure this widget to pick one.</p>';
          return;
        }
        Homey.api('GET', '/status?deviceId=' + encodeURIComponent(deviceId), {})
          .then(render)
          .catch((err) => {
            document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">' + (err && err.message ? err.message : 'Error loading data') + '</p>';
          });
      }

      function onHomeyReady(Homey) {
        Homey.ready();
        deviceId = Homey.getSettings().device?.id;
        refresh();
        setInterval(refresh, 15000);
      }
    </script>
  </body>
</html>
