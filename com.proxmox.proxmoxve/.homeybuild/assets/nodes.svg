<!-- Line-art connected-nodes icon for the Node Count capability, mirroring the Cluster driver's own
     icon (three connected nodes) at capability-icon scale. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
    <line x1="12" y1="5.5" x2="6" y2="17.5" />
    <line x1="12" y1="5.5" x2="18" y2="17.5" />
    <line x1="6" y1="17.5" x2="18" y2="17.5" />
  </g>
  <g fill="currentColor">
    <circle cx="12" cy="5.5" r="1.6" />
    <circle cx="6" cy="17.5" r="1.6" />
    <circle cx="18" cy="17.5" r="1.6" />
  </g>
</svg>
