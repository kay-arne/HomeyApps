<!-- Custom line-art icon (three connected nodes) drawn for the "Proxmox Cluster" driver, per
     Homey's App Store icon guidelines (https://apps.developer.homey.app/app-store/guidelines):
     a clean line drawing representing a cluster of connected nodes, rather than a reused/repeated
     brand mark. -->
<svg width="960" height="960" viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#000000" stroke-width="40" stroke-linecap="round">
    <line x1="480" y1="220" x2="240" y2="700" />
    <line x1="480" y1="220" x2="720" y2="700" />
    <line x1="240" y1="700" x2="720" y2="700" />
  </g>
  <g fill="#000000" stroke="none">
    <circle cx="480" cy="220" r="64" />
    <circle cx="240" cy="700" r="64" />
    <circle cx="720" cy="700" r="64" />
  </g>
</svg>
