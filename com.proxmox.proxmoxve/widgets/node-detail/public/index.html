<html>
  <head>
    <style>
      body {
        margin: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-row {
        margin-bottom: var(--homey-su-3);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px var(--homey-su-2);
        border-radius: var(--homey-su-2);
        font-size: var(--homey-font-size-small);
        border: 1px solid var(--homey-line-color);
        white-space: nowrap;
      }
      .badge-warn {
        color: var(--homey-text-color-orange);
        border-color: var(--homey-text-color-orange);
      }
      .badge-ok {
        color: var(--homey-text-color-green);
        border-color: var(--homey-text-color-green);
      }
      .metric-row {
        margin-bottom: var(--homey-su-2);
      }
      .metric-bar-bg {
        height: 8px;
        border-radius: 4px;
        background: var(--homey-line-color-light);
        overflow: hidden;
        margin-top: 2px;
      }
      .metric-bar-fill {
        height: 100%;
      }
      .fill-disk {
        background: var(--homey-text-color-orange);
      }
      .metric-graph {
        width: 100%;
        height: 28px;
        display: block;
        margin-top: 2px;
      }
      .counts-row {
        margin-top: var(--homey-su-3);
        display: flex;
        gap: var(--homey-su-4);
      }
      .empty {
        padding: var(--homey-su-4) 0;
      }
    </style>
  </head>

  <body class="homey-widget">
    <div id="content">
      <p class="homey-text-small-light homey-text-align-center">Loading…</p>
    </div>

    <script type="text/javascript">
      let deviceId = null;

      // Widgets have no access to historical data from the app - graphs are built up client-side
      // from a rolling window of live refreshes for as long as this widget instance stays open.
      const HISTORY_LEN = 20; // ~5 minutes at the 15s refresh interval below
      const history = { cpu: [], mem: [] };

      function sparkline(values, opts) {
        opts = opts || {};
        const width = 100;
        const height = 28;
        const color = opts.color || 'var(--homey-text-color-blue)';
        const clean = values.map((v) => (v == null ? 0 : v));

        if (clean.length < 2) {
          return `<svg class="metric-graph" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"></svg>`;
        }

        const lo = opts.min != null ? opts.min : Math.min(...clean);
        const hi = opts.max != null ? opts.max : Math.max(...clean);
        const range = (hi - lo) || 1;
        const stepX = width / (clean.length - 1);
        const points = clean.map((v, i) => {
          const x = i * stepX;
          const y = height - ((v - lo) / range) * (height - 2) - 1;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');

        return `<svg class="metric-graph" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
          <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"
            vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>`;
      }

      function pushHistory(arr, value) {
        arr.push(value);
        if (arr.length > HISTORY_LEN) arr.shift();
      }

      function metricGraphRow(label, value, values, color) {
        const display = value == null ? '-' : `${value}%`;
        return `
          <div class="metric-row">
            <div class="row">
              <span class="homey-text-small">${label}</span>
              <span class="homey-text-small-light">${display}</span>
            </div>
            ${sparkline(values, { color, min: 0, max: 100 })}
          </div>`;
      }

      function metricBarRow(label, value, fillClass) {
        const pct = value == null ? 0 : Math.max(0, Math.min(100, value));
        const display = value == null ? '-' : `${value}%`;
        return `
          <div class="metric-row">
            <div class="row">
              <span class="homey-text-small">${label}</span>
              <span class="homey-text-small-light">${display}</span>
            </div>
            <div class="metric-bar-bg"><div class="metric-bar-fill ${fillClass}" style="width:${pct}%"></div></div>
          </div>`;
      }

      function render(data) {
        const content = document.getElementById('content');

        if (!data.available) {
          content.innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">Node unavailable</p>';
          return;
        }

        const badge = data.offline
          ? '<span class="badge badge-warn">Offline</span>'
          : '<span class="badge badge-ok">Online</span>';

        if (!data.offline) {
          pushHistory(history.cpu, data.cpuPerc);
          pushHistory(history.mem, data.memPerc);
        } else {
          // Offline - don't keep graphing stale last-known values
          history.cpu.length = 0;
          history.mem.length = 0;
        }

        content.innerHTML = `
          <div class="row header-row">
            <span class="homey-text-medium">${data.name}</span>
            ${badge}
          </div>
          ${metricGraphRow('CPU', data.cpuPerc, history.cpu, 'var(--homey-text-color-blue)')}
          ${metricGraphRow('Memory', data.memPerc, history.mem, 'var(--homey-text-color-green)')}
          ${metricBarRow('Disk', data.diskPerc, 'fill-disk')}
          <div class="counts-row homey-text-small-light">
            <span>${data.vmCount ?? '-'} VMs</span>
            <span>${data.lxcCount ?? '-'} LXCs</span>
          </div>
        `;
      }

      function refresh() {
        if (!deviceId) {
          document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">No node device selected. Configure this widget to pick one.</p>';
          return;
        }
        Homey.api('GET', '/status?deviceId=' + encodeURIComponent(deviceId), {})
          .then(render)
          .catch((err) => {
            document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">' + (err && err.message ? err.message : 'Error loading data') + '</p>';
          });
      }

      function onHomeyReady(Homey) {
        Homey.ready();
        deviceId = Homey.getSettings().device?.id;
        refresh();
        setInterval(refresh, 15000);
      }
    </script>
  </body>
</html>
