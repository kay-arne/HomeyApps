<!-- Line-art up/down transfer arrows for the Network In/Out throughput capabilities, matching the
     driver icon family's style. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="4" x2="8" y2="13" />
    <polyline points="5,10 8,13 11,10" />
    <line x1="16" y1="20" x2="16" y2="11" />
    <polyline points="13,14 16,11 19,14" />
  </g>
</svg>
