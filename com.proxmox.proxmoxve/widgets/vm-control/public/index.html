<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        margin: 0;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-row {
        margin-bottom: var(--homey-su-2);
      }
      #list {
        overflow-y: auto;
        max-height: 230px;
        touch-action: pan-y;
      }
      .guest-row {
        padding: var(--homey-su-2) 0;
        border-bottom: var(--homey-line-light);
      }
      .guest-row:last-child {
        border-bottom: none;
      }
      .guest-info {
        display: flex;
        align-items: center;
        gap: var(--homey-su-2);
        min-width: 0;
      }
      .guest-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .status-running {
        background: var(--homey-text-color-green);
      }
      .status-stopped {
        background: var(--homey-line-color);
      }
      .guest-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .icon-btn {
        border: var(--homey-line);
        border-radius: var(--homey-border-radius-default);
        background: transparent;
        padding: 4px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .homey-custom-icon-restart {
        width: var(--homey-icon-size-small);
        height: var(--homey-icon-size-small);
        background-color: var(--homey-icon-color-dark);
        -webkit-mask-image: url('restart.svg');
        mask-image: url('restart.svg');
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-position: center;
        mask-position: center;
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .toggle-btn {
        border: var(--homey-line);
        border-radius: var(--homey-border-radius-default);
        background: transparent;
        color: var(--homey-text-color);
        font-size: var(--homey-font-size-small);
        padding: 4px var(--homey-su-2);
        cursor: pointer;
      }
      .toggle-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .empty {
        padding: var(--homey-su-4) 0;
      }
    </style>
  </head>

  <body class="homey-widget">
    <div id="content">
      <p class="homey-text-small-light homey-text-align-center">Loading…</p>
    </div>

    <script type="text/javascript">
      let deviceId = null;
      const busyKeys = new Set();

      // Homey's dashboard can hijack vertical touch-scroll from a widget's own scrollable list
      // once more than one widget is stacked in a column - manually drive the scroll and claim
      // the gesture via preventDefault() so #list scrolls instead of the dashboard itself.
      // https://community.homey.app/t/scrolling-issue-in-widget/150676
      let touchStartY = 0;
      let touchStartScrollTop = 0;
      let touchScrollEl = null;

      document.addEventListener('touchstart', (e) => {
        touchScrollEl = e.target.closest('#list');
        if (!touchScrollEl) return;
        touchStartY = e.touches[0].clientY;
        touchStartScrollTop = touchScrollEl.scrollTop;
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!touchScrollEl) return;
        const maxScroll = touchScrollEl.scrollHeight - touchScrollEl.clientHeight;
        if (maxScroll <= 0) return;
        const deltaY = touchStartY - e.touches[0].clientY;
        touchScrollEl.scrollTop = Math.max(0, Math.min(maxScroll, touchStartScrollTop + deltaY));
        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      function guestKey(g) {
        return `${g.type}-${g.vmid}`;
      }

      function guestRow(g) {
        const key = guestKey(g);
        const busy = busyKeys.has(key);
        const statusClass = g.running ? 'status-running' : 'status-stopped';
        const label = busy ? '…' : (g.running ? 'Shutdown' : 'Start');

        return `
          <div class="guest-row">
            <div class="row">
              <div class="guest-info">
                <span class="status-dot ${statusClass}"></span>
                <span class="guest-name homey-text-small">${g.name}</span>
              </div>
              <div class="guest-actions">
                <button class="icon-btn" data-action="restart" data-key="${key}" ${(!g.running || busy) ? 'disabled' : ''} title="Restart"><div class="homey-custom-icon-restart"></div></button>
                <button class="toggle-btn" data-action="toggle" data-key="${key}" ${busy ? 'disabled' : ''}>${label}</button>
              </div>
            </div>
          </div>`;
      }

      function render(data) {
        const content = document.getElementById('content');

        if (!data.available) {
          content.innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">Cluster unavailable</p>';
          return;
        }

        const listHtml = data.guests.length
          ? data.guests.map(guestRow).join('')
          : '<p class="homey-text-small-light empty">No VMs/Containers found</p>';

        content.innerHTML = `
          <div class="row header-row">
            <span class="homey-text-medium">${data.name}</span>
          </div>
          <div id="list">${listHtml}</div>
        `;

        content.querySelectorAll('[data-action="toggle"]').forEach((btn) => {
          btn.addEventListener('click', () => onAction(btn.dataset.key, data.guests, btn.dataset.action));
        });
        content.querySelectorAll('[data-action="restart"]').forEach((btn) => {
          btn.addEventListener('click', () => onAction(btn.dataset.key, data.guests, btn.dataset.action));
        });
      }

      function onAction(key, guests, action) {
        const guest = guests.find((g) => guestKey(g) === key);
        if (!guest || busyKeys.has(key)) return;

        busyKeys.add(key);
        render({ available: true, name: lastName, guests });

        const apiAction = action === 'restart' ? 'reboot' : (guest.running ? 'shutdown' : 'start');

        Homey.api('POST', '/state?deviceId=' + encodeURIComponent(deviceId), { vmid: guest.vmid, type: guest.type, action: apiAction })
          .then(() => setTimeout(refresh, 1500))
          .catch(console.error)
          .finally(() => {
            busyKeys.delete(key);
          });
      }

      let lastName = '';

      function refresh() {
        if (!deviceId) {
          document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">No cluster device selected. Configure this widget to pick one.</p>';
          return;
        }
        Homey.api('GET', '/status?deviceId=' + encodeURIComponent(deviceId), {})
          .then((data) => {
            lastName = data.name;
            render(data);
          })
          .catch((err) => {
            document.getElementById('content').innerHTML = '<p class="homey-text-small-light homey-text-align-center empty">' + (err && err.message ? err.message : 'Error loading data') + '</p>';
          });
      }

      function onHomeyReady(Homey) {
        Homey.ready();
        deviceId = Homey.getSettings().device?.id;
        refresh();
        setInterval(refresh, 15000);
      }
    </script>
  </body>
</html>
